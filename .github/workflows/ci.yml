# Everything checkable from the code alone: no API keys, no Postgres, no Chroma.
# `check` runs `poe check` (fmt, lint, the workspace suite, the pull-wiki script
# check, the fetcher and searcher suites). `images` builds every compose image,
# validates the Dagster definitions inside the code image, and starts the
# fetcher and searcher far enough to answer /healthz, so an image that no longer
# matches the workspace fails here rather than at deploy.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# This job reads code and nothing else; the default token grants more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # PR pushes only: a cancelled run on main would leave that commit with no
  # green record.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: fmt + lint + tests
    runs-on: ubuntu-latest
    # A hung job otherwise runs to GitHub's 360-minute default.
    timeout-minutes: 20
    steps:
      # Pinned by commit: a moving major tag can change silently.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # requires-python is ">=3.13" with no .python-version, so without
          # this the runner would take whatever newest Python uv finds.
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked, NOT --frozen: --frozen installs from a stale lockfile without
      # complaint; --locked fails when pyproject.toml and uv.lock disagree.
      - name: Install workspace
        run: uv sync --locked

      # The fetcher's audio tests skip when ffmpeg is absent, and the runner
      # image does not ship it.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # --locked again: a bare `uv run` re-locks on the fly and can go green on
      # a tree nobody has committed.
      - name: Run checks
        run: uv run --locked poe check

  images:
    name: images build + fetcher healthz
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every service sits behind a compose profile, and the app services read
      # an env_file that is gitignored; an empty one is enough to build. The
      # searcher's data mount is required, so any directory stands in for it.
      - name: Build every image
        run: |
          touch .env
          BACKUP_SRC_DIR=/tmp docker compose --profile '*' build

      # Inside the image rather than the dev venv, so a dependency or file the
      # image is missing fails here.
      - name: Dagster definitions load in the code image
        run: docker run --rm local/kp-dagster-code /app/.venv/bin/dagster definitions validate -m orchestrators.definitions

      # /healthz answers 503 until the required settings are present; dummy
      # values are enough, since nothing is fetched.
      - name: Fetcher answers /healthz
        run: |
          docker run -d --name fetcher-smoke -p 8000:8000 \
            -e FETCHER_SOCKS5_URL=socks5://ci.invalid:1080 \
            -e FETCHER_LLAMA_PARSE_API_KEY=ci \
            local/fetcher
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 2 localhost:8000/healthz | grep -q '"ok":true'; then exit 0; fi
            sleep 1
          done
          docker logs fetcher-smoke
          exit 1

      - name: Searcher answers /healthz
        run: |
          docker run -d --name searcher-smoke -p 8001:8000 local/searcher
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 2 localhost:8001/healthz | grep -q '"ok":true'; then exit 0; fi
            sleep 1
          done
          docker logs searcher-smoke
          exit 1
