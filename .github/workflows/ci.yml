# Everything checkable from the code alone: no API keys, no Postgres, no Chroma.
# `poe check` runs fmt, lint, the workspace suite, the pull-wiki script check and
# the fetcher suite. The fetcher is not a workspace member, so its venv is built
# separately before the checks run.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# This job reads code and nothing else; the default token grants more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # PR pushes only: a cancelled run on main would leave that commit with no
  # green record.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: fmt + lint + tests
    runs-on: ubuntu-latest
    # A hung job otherwise runs to GitHub's 360-minute default.
    timeout-minutes: 20
    steps:
      # Pinned by commit: a moving major tag can change silently.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # requires-python is ">=3.13" with no .python-version, so without
          # this the runner would take whatever newest Python uv finds.
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            services/fetcher/uv.lock

      # --locked, NOT --frozen: --frozen installs from a stale lockfile without
      # complaint; --locked fails when pyproject.toml and uv.lock disagree.
      - name: Install workspace
        run: uv sync --locked

      # The fetcher's audio tests skip when ffmpeg is absent, and the runner
      # image does not ship it.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install fetcher venv
        working-directory: services/fetcher
        run: uv sync --locked --extra dev

      # --locked again: a bare `uv run` re-locks on the fly and can go green on
      # a tree nobody has committed.
      - name: Run checks
        run: uv run --locked poe check
