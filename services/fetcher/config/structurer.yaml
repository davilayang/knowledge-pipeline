# Structurer chain config — drives /v1/structure cloud LLM fallback stage.
#
# Entries are tried in order. The first entry whose API key is configured
# (and which doesn't fail) wins. Cache rows are keyed on the chain head's
# (provider, model), so reordering invalidates prior cache entries.
#
# attempt_timeout is per-entry wall-clock seconds.

chain:
  - model: gemma4:31b
    provider: ollama
    base_url: https://ollama.com/v1
    attempt_timeout: 60.0
  - model: gpt-4.1-mini
    provider: openai
    attempt_timeout: 60.0
