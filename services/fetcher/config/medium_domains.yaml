# Hostnames whose articles are served by Medium's platform.
# The medium handler does a hostname-in-set lookup against this list.
# Add the publication's bare hostname (no scheme, no path). Hostnames
# are matched case-insensitively; the handler lowercases on load.
#
# Operators should expand this list from their actual subscription set —
# the seed below is the canonical core of well-known Medium-hosted
# publications, not an exhaustive list.

medium_domains:
  - medium.com
  - towardsdatascience.com
  - levelup.gitconnected.com
  - betterprogramming.pub
  - uxdesign.cc
  - pub.towardsai.net
