[project]
name = "fetcher"
version = "0.1.0"
description = "URL -> markdown fetcher service for KP + NA (single source of truth for content fetching)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "httpx>=0.27,<1.0",
    "curl-cffi>=0.7,<0.13",
    "trafilatura>=2.0,<3.0",
    "pymupdf4llm>=0.0.17,<1.0",
    "youtube-transcript-api>=1.0,<2.0",
    "pysocks>=1.7,<2.0",
    "tenacity>=9.0,<10.0",
    "markdownify>=1.2,<2.0",
    "beautifulsoup4>=4.14,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.7,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fetcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"
