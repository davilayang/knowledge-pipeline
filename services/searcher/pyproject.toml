[project]
name = "searcher"
version = "0.43.6"
description = "Search service for Knowledge OS: POST /v1/search over everything the user saved or discussed"
requires-python = ">=3.13"
dependencies = [
    "knowledge-retrievers",
    "chromadb-client>=1.5,<2.0",
    "fastapi>=0.115,<1.0",
    "pyyaml",
    "pydantic>=2.9,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/searcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.uv.sources]
knowledge-retrievers = { workspace = true }
