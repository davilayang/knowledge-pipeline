[project]
name = "knowledge-domains"
version = "0.29.0"
description = "Pure data layer — types, schema, sources (no LLM/ML/Dagster deps)"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0",
    "psycopg[binary]>=3.2",
    "pyyaml",
    "python-frontmatter",
]

[project.scripts]
wiki-reject = "domains.wiki.reject_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domains"]
