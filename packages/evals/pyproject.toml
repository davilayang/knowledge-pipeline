[project]
name = "knowledge-evals"
version = "0.6.3"
description = "Eval harnesses — RAG metrics, wiki quality dimensions, baselines"
requires-python = ">=3.13"
dependencies = [
    "knowledge-domains",
    "knowledge-workflows",
    "knowledge-retrievers",
    "ragas>=0.2,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evals"]
