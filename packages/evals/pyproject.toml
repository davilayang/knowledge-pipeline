[project]
name = "knowledge-evals"
version = "0.36.7"
description = "Eval harnesses — retrieval (Recall@K / MRR / nDCG), generation quality (faithfulness / relevance / grounding), wiki dimensions"
requires-python = ">=3.13"
dependencies = [
    "knowledge-domains",
    "knowledge-workflows",
    "knowledge-retrievers",
    # Retrieval eval (evals.retrieval) — runs against a real Chroma instance,
    # embeds via retrievers.embedding.OpenAIEmbedder.
    "chromadb-client>=1.5,<2.0",
    # Vectorised pairwise-cosine for the wiki dedup candidate search
    # (evals.wiki_dedup) — a pure-Python O(n²)×dims loop times out at prod scale.
    "numpy>=1.26",
    # Reserved for the generation-quality eval layer (faithfulness /
    # answer-relevance / grounding) once wiki+research workflows consume
    # retrieved context. Not imported yet — see CHANGELOG.
    "ragas>=0.2,<1.0",
]

[project.scripts]
eval-retrieval      = "evals.retrieval.cli:main"
eval-narrative-coverage = "evals.extraction.coverage_cli:main"
eval-extract-claims = "evals.wiki.claims.benchmark:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evals"]
