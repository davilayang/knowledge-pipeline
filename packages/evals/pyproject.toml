[project]
name = "knowledge-evals"
version = "0.9.3"
description = "Eval harnesses — RAG metrics, wiki quality dimensions, baselines"
requires-python = ">=3.13"
dependencies = [
    "knowledge-domains",
    "knowledge-workflows",
    "knowledge-retrievers",
    "ragas>=0.2,<1.0",
    "chromadb>=1.5,<2.0",
    "openai>=2.0,<3.0",
    "tenacity>=8.0",
]

[project.scripts]
eval-retrieval = "evals.retrieval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evals"]
