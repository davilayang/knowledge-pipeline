[project]
name = "knowledge-orchestrators"
version = "0.28.0"
description = "Deployable orchestrators (Dagster today) — the only package allowed to depend on Dagster"
requires-python = ">=3.13"
dependencies = [
    "knowledge-domains",
    "knowledge-workflows",
    "knowledge-retrievers",
    "dagster",
    "dagster-dg-cli",
    "dagster-postgres",
    "dagster-webserver",
    "poethepoet",
    "notion-client>=2.2,<3.0",
    "trafilatura>=2.0,<3.0",
    "tenacity>=9.0,<10.0",
    "httpx>=0.27,<1.0",
    "defusedxml>=0.7,<1.0",
    "pyyaml>=6.0,<7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrators"]
