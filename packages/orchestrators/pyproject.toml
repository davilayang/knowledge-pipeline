[project]
name = "knowledge-orchestrators"
version = "0.6.3"
description = "Deployable orchestrators (Dagster today) — the only package allowed to depend on Dagster"
requires-python = ">=3.13"
dependencies = [
    "knowledge-domains",
    "knowledge-workflows",
    "dagster",
    "dagster-dg-cli",
    "dagster-postgres",
    "dagster-webserver",
    "poethepoet",
]

[project.optional-dependencies]
# Install with `uv sync --extra workbench` (or via the root workspace) for local
# RAG workbench use. Excluded from the production Docker image — these pull in
# sentence-transformers/PyTorch/chromadb/ragas (~8GB) not needed for wiki or backup.
workbench = [
    "knowledge-workflows[agents]",  # activates retrievers via the agents extra
    "knowledge-retrievers",
    "knowledge-evals",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrators"]
