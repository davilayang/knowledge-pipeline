[project]
name = "knowledge-orchestrators"
version = "0.14.8"
description = "Deployable orchestrators (Dagster today) — the only package allowed to depend on Dagster"
requires-python = ">=3.13"
dependencies = [
    "knowledge-domains",
    "knowledge-workflows",
    "knowledge-retrievers",
    "dagster",
    "dagster-dg-cli",
    "dagster-postgres",
    "dagster-webserver",
    "poethepoet",
    "notion-client>=2.2,<3.0",
    "curl-cffi>=0.7,<0.13",
    "trafilatura>=2.0,<3.0",
    "openai>=1.0,<2.0",
    "youtube-transcript-api>=1.0,<2.0",
    "pysocks>=1.7,<2.0",
    "arxiv>=2.1,<3.0",
    "tenacity>=9.0,<10.0",
    "httpx>=0.27,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrators"]
