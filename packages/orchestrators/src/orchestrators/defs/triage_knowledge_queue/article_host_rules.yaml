# Article URL host → content_shape mapping.
# `classify_content_shape` strips the `www.` prefix and lowercases the host
# before lookup. `unknown` is a valid value: hosts that mix
# conference / tutorial / opinion content (facebook.com, twitter.com)
# explicitly route to unknown rather than guessing.
article_host_shape:
  # Substacks + personal opinion blogs
  ontologist.substack.com: opinion_essay
  samuelrinko.substack.com: opinion_essay
  tidyfirst.substack.com: opinion_essay
  dataopsleadership.substack.com: opinion_essay
  entropicthoughts.com: opinion_essay
  spyglass.org: opinion_essay
  om.co: opinion_essay
  registerspill.thorstenball.com: opinion_essay
  jonoalderson.com: opinion_essay
  sixcolors.com: opinion_essay
  lesswrong.com: opinion_essay
  blog.dataengineerthings.org: opinion_essay
  # News (folded into opinion_essay for v1 — extractor needs overlap;
  # revisit if news grows above ~10% or if v1 shows measurably worse output)
  arstechnica.com: opinion_essay
  404media.co: opinion_essay
  geekwire.com: opinion_essay
  kdnuggets.com: opinion_essay
  # Tutorial-leaning
  addyosmani.com: tutorial
  docs.getdbt.com: tutorial
  headroom-docs.vercel.app: tutorial
  infusedata.io: tutorial
  claude.com: tutorial
  motherduck.com: tutorial
  posthog.com: tutorial
  pub.towardsai.net: tutorial
  ai.gopubby.com: tutorial
  # Research blogs
  research.google: research_summary
  research.perplexity.ai: research_summary
  netflixtechblog.com: research_summary
  netflixtechblog.medium.com: research_summary
  # Always-ambiguous — explicit `unknown` keeps the classifier honest
  facebook.com: unknown
