[project]
name = "apps"
version = "0.1.0"
description = "Dagster orchestration app — the only package allowed to depend on Dagster"
requires-python = ">=3.13"
dependencies = [
    "domains",
    "workflows",
    "retrievers",
    "evals",
    "dagster",
    "dagster-postgres",
    "dagster-webserver",
    "poethepoet",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apps"]
