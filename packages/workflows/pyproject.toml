[project]
name = "knowledge-workflows"
version = "0.36.8"
description = "LangGraph agentic workflows and agent primitives"
requires-python = ">=3.13"
dependencies = [
    "knowledge-domains",
    "knowledge-retrievers",
    # Kept as the toehold for the deferred writer/evaluator synthesis experiment
    # (the one place a sub-graph re-earns its place); pulls langchain-core
    # transitively. The wiki path itself is plain OpenAI SDK + langfuse.openai.
    "langgraph>=1.0,<2.0",
    "openai>=1.0,<2.0",
    "langfuse>=3.0,<4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workflows"]
