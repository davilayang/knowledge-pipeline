[project]
name = "retrievers"
version = "0.1.0"
description = "RAG infrastructure — chunking, embedding, vector store, retrieval strategies"
requires-python = ">=3.13"
dependencies = [
    "domains",
    "chromadb>=0.5",
    "sentence-transformers",
    "rank_bm25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrievers"]
