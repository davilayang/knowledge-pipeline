[project]
name = "knowledge-retrievers"
version = "0.36.8"
description = "RAG infrastructure — chunking, embedding (OpenAI), Chroma HTTP client, retrieval protocols"
requires-python = ">=3.13"
dependencies = [
    "knowledge-domains",
    "chromadb-client>=1.5,<2.0",
    "langchain-text-splitters>=1.1,<2.0",
    "tiktoken>=0.9,<1.0",
    "openai>=1.0",
    "tenacity>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrievers"]
