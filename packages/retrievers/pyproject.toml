[project]
name = "knowledge-retrievers"
version = "0.9.1"
description = "RAG infrastructure — chunking, embedding, vector store, retrieval strategies"
requires-python = ">=3.13"
dependencies = [
    "knowledge-domains",
    "chromadb>=1.5,<2.0",
    "sentence-transformers>=3.0,<4.0",
    "rank-bm25>=0.2,<1.0",
    "langchain-text-splitters>=1.1,<2.0",
    "langchain-experimental>=0.3,<1.0",
    "langchain-community>=0.3,<1.0",
    "tiktoken>=0.9,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrievers"]
