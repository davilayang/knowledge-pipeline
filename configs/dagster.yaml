storage:
  postgres:
    postgres_db:
      hostname:
        env: DAGSTER_PG_HOST
      port:
        env: DAGSTER_PG_PORT
      username:
        env: DAGSTER_PG_USERNAME
      password:
        env: DAGSTER_PG_PASSWORD
      db_name:
        env: DAGSTER_PG_DB

# Per-step stdout/stderr capture. Defaults to <DAGSTER_HOME>/storage which
# isn't writable by the non-root dagster user; point at the bind-mounted
# /app/logs (compose mounts ./logs there).
compute_logs:
  module: dagster._core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /app/logs

concurrency:
  runs:
    max_concurrent_runs: 5
  pools:
    # default_limit: 1 is load-bearing for the wiki single-writer guarantee:
    # synthesize_wiki and sync_wiki_curation share the "synthesize-wiki" op pool
    # (WIKI_DB_CONCURRENCY_KEY) so their wiki.db writes can never overlap. Raising
    # this — or giving that pool an explicit higher limit — breaks it silently.
    granularity: op
    default_limit: 1

run_launcher:
  module: dagster.core.launcher
  class: DefaultRunLauncher

telemetry:
  enabled: false
