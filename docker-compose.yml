# Dagster server infrastructure for knowledge-pipeline.
#
# Usage:
#   docker compose up --build
#   docker compose down --volumes
#
# UI:  http://localhost:3030
# For local dev, skip Docker and use `uv run poe dagster-dev` which auto-reloads.

services:
  # Configured with 2 databases: dagster & knowledge-pipeline
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "max_connections=50", "-c", "shared_buffers=256MB"]
    environment:
      POSTGRES_USER: ${DAGSTER_PG_USERNAME}
      POSTGRES_PASSWORD: ${DAGSTER_PG_PASSWORD}
      POSTGRES_DB: ${DAGSTER_PG_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dagster_network
    restart: unless-stopped

  dagster-code:
    image: ${DOCKER_USER:-local}/kp-dagster-code
    build:
      context: .
      dockerfile: docker/code/Dockerfile
    env_file: .env
    environment:
      DAGSTER_CURRENT_IMAGE: ${DOCKER_USER:-local}/kp-dagster-code
      DATABASE_URL: postgresql://${DAGSTER_PG_USERNAME}:${DAGSTER_PG_PASSWORD}@postgres:5432/knowledge_pipeline
      # The backup pipeline reads BACKUP_SOURCE_DIR from env. The host path on
      # disk (e.g. /home/deploy/newsletter-assistant/data) doesn't exist inside
      # the container; we bind-mount it at /app/source and override the env so
      # the code always sees a stable in-container path.
      BACKUP_SOURCE_DIR: /app/source
    volumes:
      - ./data:/app/data
      - ./datasets:/app/datasets
      - ./backups:/app/backups
      # rclone config — populated on the server by `deploy-hcloud.sh push-creds`.
      # Mounted at rclone's default lookup path so no RCLONE_CONFIG override is needed.
      - ./.rclone:/home/dagster/.config/rclone:ro
      # Source DB dir for backup_readings. BACKUP_SOURCE_DIR in .env points at
      # the host path (e.g. /home/deploy/newsletter-assistant/data); compose
      # bind-mounts that to /app/source read-only, and the container env above
      # overrides BACKUP_SOURCE_DIR to /app/source for the code.
      - ${BACKUP_SOURCE_DIR:-./data}:/app/source:ro
    networks:
      - dagster_network
    # Healthcheck inherited from docker/code/Dockerfile (single source of truth).
    restart: on-failure

  dagster-webserver:
    image: ${DOCKER_USER:-local}/kp-dagster-webserver
    build:
      context: .
      dockerfile: docker/dagster/Dockerfile
    entrypoint:
      - dagster-webserver
      - -h
      - "0.0.0.0"
      - -p
      - "3000"
      - -w
      - /opt/dagster/home/workspace.yaml
    depends_on:
      postgres:
        condition: service_healthy
      dagster-code:
        condition: service_healthy
    # Only the Postgres run-store creds. No env_file — webserver doesn't need
    # LLM keys or backup config and we'd rather not leak them.
    environment:
      DAGSTER_PG_HOST: postgres
      DAGSTER_PG_PORT: ${DAGSTER_PG_PORT}
      DAGSTER_PG_USERNAME: ${DAGSTER_PG_USERNAME}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB}
    ports:
      - "${APP_HOST:-127.0.0.1}:3030:3000"
    networks:
      - dagster_network
    healthcheck:
      # /server_info is what the upstream Helm chart's readiness probe hits.
      # Slim base has no curl; use stdlib urllib instead.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:3000/server_info', timeout=2).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  dagster-daemon:
    image: ${DOCKER_USER:-local}/kp-dagster-daemon
    build:
      context: .
      dockerfile: docker/dagster/Dockerfile
    entrypoint:
      - dagster-daemon
      - run
      - -w
      - /opt/dagster/home/workspace.yaml
    depends_on:
      postgres:
        condition: service_healthy
      dagster-code:
        condition: service_healthy
    # Only the Postgres run-store creds — daemon scope is the same as webserver.
    environment:
      DAGSTER_PG_HOST: postgres
      DAGSTER_PG_PORT: ${DAGSTER_PG_PORT}
      DAGSTER_PG_USERNAME: ${DAGSTER_PG_USERNAME}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB}
    networks:
      - dagster_network
    healthcheck:
      test: ["CMD", "dagster-daemon", "liveness-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: on-failure

networks:
  dagster_network:
    driver: bridge
    name: dagster_network

volumes:
  postgres_data:
