# Dagster server infrastructure for knowledge-pipeline.
#
# Usage:
#   docker compose up --build
#   docker compose down --volumes
#
# UI:  http://localhost:3030
# For local dev, skip Docker and use `uv run poe dagster-dev` which auto-reloads.

services:
  # Configured with 2 databases: dagster & knowledge-pipeline
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "max_connections=50", "-c", "shared_buffers=256MB"]
    environment:
      POSTGRES_USER: ${DAGSTER_PG_USERNAME}
      POSTGRES_PASSWORD: ${DAGSTER_PG_PASSWORD}
      POSTGRES_DB: ${DAGSTER_PG_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dagster_network
    restart: unless-stopped

  dagster-code:
    build:
      context: .
      dockerfile: docker/code/Dockerfile
    image: knowledge_pipeline_code
    # Pulls everything from .env automatically. New env vars added there are
    # forwarded into the container without editing this file. The two entries
    # below are explicit because they're either composed at compose-substitution
    # time (DATABASE_URL) or static / not in .env (DAGSTER_CURRENT_IMAGE).
    env_file: .env
    environment:
      DAGSTER_CURRENT_IMAGE: knowledge_pipeline_code
      DATABASE_URL: postgresql://${DAGSTER_PG_USERNAME}:${DAGSTER_PG_PASSWORD}@postgres:5432/knowledge_pipeline
      # rclone normally resolves config via $HOME/.config/rclone/rclone.conf, but
      # the dagster user (uid 1001) has no home dir. Point rclone directly at the
      # mounted file so the lookup doesn't depend on $HOME.
      RCLONE_CONFIG: /app/.rclone/rclone.conf
    volumes:
      - ./data:/app/data
      - ./datasets:/app/datasets
      - ./backups:/app/backups
      # rclone config — populated on the server by `deploy-hcloud.sh push-creds`.
      - ./.rclone:/app/.rclone:ro
    networks:
      - dagster_network
    healthcheck:
      test: ["CMD", "/app/.venv/bin/dagster", "api", "grpc-health-check", "-p", "4000"]
      timeout: 1s
      interval: 5s
      retries: 20
      start_period: 30s
    restart: on-failure

  dagster-webserver:
    build:
      context: .
      dockerfile: docker/dagster/Dockerfile
    entrypoint:
      - dagster-webserver
      - -h
      - "0.0.0.0"
      - -p
      - "3000"
      - -w
      - /opt/dagster/home/workspace.yaml
    depends_on:
      postgres:
        condition: service_healthy
      dagster-code:
        condition: service_healthy
    # Only the Postgres run-store creds. No env_file — webserver doesn't need
    # LLM keys or backup config and we'd rather not leak them.
    environment:
      DAGSTER_PG_HOST: postgres
      DAGSTER_PG_PORT: ${DAGSTER_PG_PORT}
      DAGSTER_PG_USERNAME: ${DAGSTER_PG_USERNAME}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB}
    ports:
      - "${APP_HOST:-127.0.0.1}:3030:3000"
    networks:
      - dagster_network
    healthcheck:
      # /server_info is what the upstream Helm chart's readiness probe hits.
      # Slim base has no curl; use stdlib urllib instead.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:3000/server_info', timeout=2).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  dagster-daemon:
    build:
      context: .
      dockerfile: docker/dagster/Dockerfile
    entrypoint:
      - dagster-daemon
      - run
      - -w
      - /opt/dagster/home/workspace.yaml
    depends_on:
      postgres:
        condition: service_healthy
      dagster-code:
        condition: service_healthy
    # Only the Postgres run-store creds — daemon scope is the same as webserver.
    environment:
      DAGSTER_PG_HOST: postgres
      DAGSTER_PG_PORT: ${DAGSTER_PG_PORT}
      DAGSTER_PG_USERNAME: ${DAGSTER_PG_USERNAME}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB}
    networks:
      - dagster_network
    healthcheck:
      test: ["CMD", "dagster-daemon", "liveness-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: on-failure

networks:
  dagster_network:
    driver: bridge
    name: dagster_network

volumes:
  postgres_data:
