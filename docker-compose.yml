# Dagster server infrastructure for knowledge-pipeline.
#
# Profiles:
#   data — postgres + chroma (the local-dev backing services)
#   app  — dagster-code + dagster-webserver + dagster-daemon (the Dagster stack)
#
# Usage:
#   docker compose --profile app up --build       # full stack (app + auto-pulls data via depends_on)
#   docker compose --profile data up -d           # data services only — for ad-hoc inspection
#   docker compose down --volumes
#
# UI:  http://localhost:3030/dags  (webserver runs with --path-prefix=/dags
#                                   for reverse-proxy mounting; see Caddyfile in newsletter-assistant)
# For local dev, skip Docker for the Dagster stack and use `uv run poe dagster-dev`,
# which starts the data services (compose `data` profile) and tears them down on exit.

services:
  # Configured with 2 databases: dagster & knowledge-pipeline
  postgres:
    image: postgres:16
    # Tagged with both profiles so `--profile data` works standalone (used by
    # `poe dagster-dev`) and `--profile app` resolves dagster services'
    # depends_on links.
    profiles: [data, app]
    command: ["postgres", "-c", "max_connections=50", "-c", "shared_buffers=256MB"]
    environment:
      POSTGRES_USER: ${DAGSTER_PG_USERNAME}
      POSTGRES_PASSWORD: ${DAGSTER_PG_PASSWORD}
      POSTGRES_DB: ${DAGSTER_PG_DB}
    ports:
      # Loopback-only bind for laptop `dg dev` against compose Pg.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dagster_network
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:1.5.5
    # See postgres above — dual-profile so dagster-code's depends_on resolves
    # under --profile app, and --profile data works standalone.
    profiles: [data, app]
    ports:
      # Loopback-only bind so `poe dagster-dev` (running on the host) can
      # reach compose's chroma at localhost:8000 — same pattern as postgres.
      - "127.0.0.1:8000:8000"
    volumes:
      - chroma_data:/data
    networks:
      - dagster_network
    healthcheck:
      # chromadb/chroma:1.5.5 ships no curl/wget/python — only bash. Use bash's
      # /dev/tcp builtin: the `:` no-op exits 0 iff the port is open. Chroma's
      # FastAPI/Uvicorn binds the port only after init is complete, so
      # port-open is a sound proxy for "ready".
      test: ["CMD", "bash", "-c", ": </dev/tcp/localhost/8000"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  dagster-code:
    image: ${DOCKER_USER:-local}/kp-dagster-code
    profiles: [app]
    build:
      context: .
      dockerfile: docker/code/Dockerfile
      args:
        # Match the host user's uid/gid so bind-mounted files are readable
        # without any chown. Defaults to 1001 if not set in .env.
        APP_UID: ${APP_UID:-1001}
        APP_GID: ${APP_GID:-1001}
    depends_on:
      chroma:
        condition: service_healthy
    env_file: .env
    environment:
      DAGSTER_CURRENT_IMAGE: ${DOCKER_USER:-local}/kp-dagster-code
      BACKUP_SRC_DIR: /app/source # Used by app in container
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      FETCHER_URL: http://fetcher:8000  # override .env's localhost for laptop dev
    volumes:
      - ./data:/app/data
      - ./datasets:/app/datasets
      - ./backups:/app/backups
      - ./logs:/app/logs # Per-step compute logs (uid 1001 must own ./logs on host)
      - ./.rclone:/home/dagster/.config/rclone:ro # Mount rclone config
      - ${BACKUP_SRC_DIR:-./data}:/app/source:ro # Mount source data folder at container
    networks:
      - dagster_network
    restart: on-failure

  dagster-webserver:
    image: ${DOCKER_USER:-local}/kp-dagster-webserver
    profiles: [app]
    build:
      context: .
      dockerfile: docker/dagster/Dockerfile
    entrypoint:
      - dagster-webserver
      - -h
      - "0.0.0.0"
      - -p
      - "3000"
      - --path-prefix
      - /dags
      - -w
      - /opt/dagster/home/workspace.yaml
    depends_on:
      postgres:
        condition: service_healthy
      dagster-code:
        condition: service_healthy
    environment:
      DAGSTER_PG_HOST: postgres
      DAGSTER_PG_PORT: ${DAGSTER_PG_PORT}
      DAGSTER_PG_USERNAME: ${DAGSTER_PG_USERNAME}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB}
    ports:
      - "127.0.0.1:3030:3000"
      - "${APP_HOST:-127.0.0.2}:3030:3000"
    networks:
      - dagster_network
    # python urllib instead of curl — slim base ships neither curl nor wget,
    # and Dagster's reference image is python:slim + pip install (no HTTP client).
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:3000/dags/server_info', timeout=2).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  dagster-daemon:
    image: ${DOCKER_USER:-local}/kp-dagster-daemon
    profiles: [app]
    build:
      context: .
      dockerfile: docker/dagster/Dockerfile
    entrypoint:
      - dagster-daemon
      - run
      - -w
      - /opt/dagster/home/workspace.yaml
    depends_on:
      postgres:
        condition: service_healthy
      dagster-code:
        condition: service_healthy
    environment:
      DAGSTER_PG_HOST: postgres
      DAGSTER_PG_PORT: ${DAGSTER_PG_PORT}
      DAGSTER_PG_USERNAME: ${DAGSTER_PG_USERNAME}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB}
    networks:
      - dagster_network
    healthcheck:
      test: ["CMD", "dagster-daemon", "liveness-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: on-failure

  fetcher:
    image: ${DOCKER_USER:-local}/fetcher
    profiles: [app]
    platform: ${PLATFORM:-}
    build:
      context: .
      dockerfile: docker/fetcher/Dockerfile
    env_file: .env
    environment:
      - FETCHER_DB_PATH=/app/data/fetches.db
    volumes:
      - ./data:/app/data
    networks:
      dagster_network: {}
      kos_network:
        aliases:
          - kp-fetcher
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

networks:
  dagster_network:
    driver: bridge
    name: dagster_network
  kos_network:
    external: true
    name: kos-network

volumes:
  postgres_data:
  chroma_data:
