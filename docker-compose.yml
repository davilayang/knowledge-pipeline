# Dagster server infrastructure for knowledge-pipeline.
#
# Usage:
#   docker compose up --build
#   docker compose down --volumes
#
# UI:  http://localhost:3030
# For local dev, skip Docker and use `uv run poe dagster-dev` which auto-reloads.

services:
  # Configured with 2 databases: dagster & knowledge-pipeline
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "max_connections=50", "-c", "shared_buffers=256MB"]
    environment:
      POSTGRES_USER: ${DAGSTER_PG_USERNAME}
      POSTGRES_PASSWORD: ${DAGSTER_PG_PASSWORD}
      POSTGRES_DB: ${DAGSTER_PG_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dagster_network
    restart: unless-stopped

  dagster-code:
    image: ${DOCKER_USER:-local}/kp-dagster-code
    build:
      context: .
      dockerfile: docker/code/Dockerfile
      args:
        # Match the host user's uid/gid so bind-mounted files are readable
        # without any chown. Defaults to 1001 if not set in .env.
        APP_UID: ${APP_UID:-1001}
        APP_GID: ${APP_GID:-1001}
    env_file: .env
    environment:
      DAGSTER_CURRENT_IMAGE: ${DOCKER_USER:-local}/kp-dagster-code
      DATABASE_URL: postgresql://${DAGSTER_PG_USERNAME}:${DAGSTER_PG_PASSWORD}@postgres:5432/knowledge_pipeline
      BACKUP_SOURCE_DIR: /app/source # Used by app in container
    volumes:
      - ./data:/app/data
      - ./datasets:/app/datasets
      - ./backups:/app/backups
      - ./logs:/app/logs # Per-step compute logs (uid 1001 must own ./logs on host)
      - ./.rclone:/home/dagster/.config/rclone:ro # Mount rclone config
      - ${BACKUP_SOURCE_DIR:-./data}:/app/source:ro # Mount source data folder at container
    networks:
      - dagster_network
    restart: on-failure

  dagster-webserver:
    image: ${DOCKER_USER:-local}/kp-dagster-webserver
    build:
      context: .
      dockerfile: docker/dagster/Dockerfile
    entrypoint:
      - dagster-webserver
      - -h
      - "0.0.0.0"
      - -p
      - "3000"
      - -w
      - /opt/dagster/home/workspace.yaml
    depends_on:
      postgres:
        condition: service_healthy
      dagster-code:
        condition: service_healthy
    environment:
      DAGSTER_PG_HOST: postgres
      DAGSTER_PG_PORT: ${DAGSTER_PG_PORT}
      DAGSTER_PG_USERNAME: ${DAGSTER_PG_USERNAME}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB}
    ports:
      - "${APP_HOST:-127.0.0.1}:3030:3000"
    networks:
      - dagster_network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:3000/server_info', timeout=2).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  dagster-daemon:
    image: ${DOCKER_USER:-local}/kp-dagster-daemon
    build:
      context: .
      dockerfile: docker/dagster/Dockerfile
    entrypoint:
      - dagster-daemon
      - run
      - -w
      - /opt/dagster/home/workspace.yaml
    depends_on:
      postgres:
        condition: service_healthy
      dagster-code:
        condition: service_healthy
    environment:
      DAGSTER_PG_HOST: postgres
      DAGSTER_PG_PORT: ${DAGSTER_PG_PORT}
      DAGSTER_PG_USERNAME: ${DAGSTER_PG_USERNAME}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB}
    networks:
      - dagster_network
    healthcheck:
      test: ["CMD", "dagster-daemon", "liveness-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: on-failure

networks:
  dagster_network:
    driver: bridge
    name: dagster_network

volumes:
  postgres_data:
