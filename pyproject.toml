[project]
name = "knowledge-pipeline"
version = "0.6.5"
description = """
  Knowledge pipeline workspace — RAG indexing, LangGraph wiki synthesis, evaluation, and source backups
"""
requires-python = ">=3.13"
dependencies = [
    "knowledge-domains",
    "knowledge-evals",
    "knowledge-orchestrators",
    "knowledge-retrievers",
    "knowledge-workflows",
]

[dependency-groups]
dev = [
    "black>=24.0,<25.0",
    "ruff>=0.8,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-postgresql>=6.0,<8.0",
    "pytest-timeout>=2.3,<3.0",
]

# No [build-system] — root is a virtual project (uv handles this implicitly)
# All buildable code lives in workspace members under packages/.

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
# For data models, schemas ...etc
knowledge-domains = { workspace = true }
# For Eval suites
knowledge-evals = { workspace = true }
# For Pipeline orchestrator (Dagster)
knowledge-orchestrators = { workspace = true }
# For Retrieval algorithms (RAG)
knowledge-retrievers = { workspace = true }
# For LangGraph-based workflows for complex processing
knowledge-workflows = { workspace = true }

[tool.dagster]
module_name = "orchestrators.definitions"
code_location_name = "orchestrators"

# Poe the Poet (Scripting) #

## Dagster ##

[tool.poe.tasks.dagster-dev]
cmd = """
  dagster dev --port 3030
    -m orchestrators.defs.workbench.definitions
    -m orchestrators.defs.pipelines.definitions
"""
help = "Launch Dagster UI at localhost:3030 with workbench + pipelines as separate code locations"

[tool.poe.tasks.index]
cmd = "dg launch -m orchestrators.defs.workbench.definitions --job idx_markdown_minilm"
help = "Run index job once from CLI"

[tool.poe.tasks.backup]
cmd = "dg launch -m orchestrators.defs.pipelines.definitions --job backup_readings"
help = "Run readings backup job once from CLI"

[tool.poe.tasks.eval]
cmd = "dg launch -m orchestrators.defs.workbench.definitions --job evaluate_retrieval_strategies"
help = "Run evaluation across RAG strategies"

## Deploy ##

[tool.poe.tasks.deploy]
cmd = "./scripts/deploy-hcloud.sh ${target}"
help = "Run a deploy-hcloud.sh subcommand on Hetzner (default: deploy). For the deploy subcommand, append --branch <name> and/or --no-build after a -- separator: uv run poe deploy -- --branch fix/foo"

[tool.poe.tasks.deploy.args.target]
positional = true
default = "deploy"

## Tunnel ##

[tool.poe.tasks.tunnel]
shell = """
echo "Dagster UI: http://localhost:3030/dags (forwarded to remote :3030, served behind /dags prefix)"
ssh -L 3030:127.0.0.1:3030 -i ${IDENTITY_FILE} ${DEPLOY_TARGET} -N
"""
envfile = ".env.deploy"
help = "SSH tunnel to remote Dagster UI"

## Code QA ##

[tool.poe.tasks.test]
cmd = "pytest -v"
help = "Run tests with verbose output"

[tool.poe.tasks.check]
sequence = ["fmt", "lint", "test"]
help = "Run all checks: formatting, linting, and tests"

[tool.poe.tasks.fmt]
cmd = "black --check packages/ tests/"
help = "Check code formatting with black (does not modify)"

[tool.poe.tasks.fmt-fix]
cmd = "black packages/ tests/"
help = "Fix code formatting issues automatically with black"

[tool.poe.tasks.lint]
cmd = "ruff check packages/ tests/"
help = "Check code linting with ruff (does not modify)"

[tool.poe.tasks.lint-fix]
cmd = "ruff check --fix packages/ tests/"
help = "Fix code linting issues automatically with ruff"

[tool.poe.tasks.fix]
sequence = ["fmt-fix", "lint-fix"]
help = "Fix all issues: formatting with black and linting with ruff"

## Workflows ##

[tool.poe.tasks.wiki-ingest]
cmd = "python -m workflows.cli.wiki_ingest"
help = "Run the LangGraph wiki synthesis workflow from the CLI"

[tool.poe.tasks.wiki-lint]
cmd = "python -m workflows.cli.wiki_lint"
help = "Lint wiki pages for structural and quality issues"

[tool.poe.tasks.research]
cmd = "python -m workflows.cli.research"
help = "Run the research agent workflow from the CLI"

## Evals ##

[tool.poe.tasks.wiki-eval]
cmd = "python -m evals.cli.wiki_eval"
help = "Run the wiki evaluation harness across all six quality dimensions"

[tool.poe.tasks.rag-eval]
cmd = "python -m evals.cli.rag_eval"
help = "Run the RAG evaluation harness with Ragas metrics"

## Reset ##

[tool.poe.tasks.reset-indices]
cmd = "rm -rf data/chunks/ data/embeddings/ data/chroma/"
help = "Delete all chunks, embeddings, and ChromaDB data (re-run index jobs to rebuild)"

[tool.poe.tasks.reset-wiki]
cmd = "python -m orchestrators.scripts.reset_wiki"
help = "Drop the wiki Postgres schema, data/wiki/ files, and workflow checkpoints"

[tool.poe.tasks.reset-checkpoints]
cmd = "python -m orchestrators.scripts.reset_checkpoints"
help = "Drop the langgraph_checkpoints Postgres schema only"

[tool.poe.tasks.reset-everything]
cmd = "python -m orchestrators.scripts.reset_everything"
help = "Drop all wiki data, raw store, ChromaDB collections, and checkpoints"

[tool.pytest.ini_options]
testpaths = ["tests"]

## Dependency Configurations ##

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
