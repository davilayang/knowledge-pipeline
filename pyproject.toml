[project]
name = "knowledge-pipeline"
version = "0.25.1"
description = """
  Knowledge pipeline workspace — RAG indexing, LangGraph wiki synthesis, evaluation, and source backups
"""
requires-python = ">=3.13"
dependencies = [
    "knowledge-domains",
    "knowledge-evals",
    "knowledge-orchestrators",
    "knowledge-retrievers",
    "knowledge-workflows",
]

# For user-facing extras
[project.optional-dependencies]
notebooks = [
    "ipykernel>=6.0",
    "jupyterlab",
    "jupyterlab-vim",
    "jupyter-collaboration==4.0.2",
    "jupyter-mcp-tools>=0.1.4",
    "jupytext>=1.16",
    "papermill>=2.6",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

# For local dev/test/lint tooling
[dependency-groups]
dev = [
    "black[jupyter]>=24.0,<25.0",
    "ruff>=0.8,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-postgresql>=6.0,<8.0",
    "pytest-timeout>=2.3,<3.0",
    "pytest-xdist>=3.8.0",
]

# No [build-system] — root is a virtual project (uv handles this implicitly)
# All buildable code lives in workspace members under packages/.

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
# For data models, schemas ...etc
knowledge-domains = { workspace = true }
# For Eval suites
knowledge-evals = { workspace = true }
# For Pipeline orchestrator (Dagster)
knowledge-orchestrators = { workspace = true }
# For Retrieval algorithms (RAG)
knowledge-retrievers = { workspace = true }
# For LangGraph-based workflows for complex processing
knowledge-workflows = { workspace = true }

[tool.dagster]
module_name = "orchestrators.definitions"
code_location_name = "orchestrators"

# Poe the Poet (Scripting) #

## Dagster ##

[tool.poe.tasks.dagster-dev]
# trap on EXIT/INT/TERM stops the data services when `dagster dev` exits
# (Ctrl+C, crash, normal end) — single-command lifecycle for local dev.
shell = """
trap 'docker compose --profile data down' EXIT INT TERM
docker compose --profile data up -d
dagster dev --port 3030 -m orchestrators.definitions
"""
help = "Start postgres + chroma, launch Dagster UI at localhost:3030; tear down data services on exit"

[tool.poe.tasks.fetcher-dev]
# Single worker is load-bearing (see services/fetcher/README.md).
# FETCHER_DB_PATH override redirects the SQLite file from the container path
# (/app/data/fetches.db, set in .env) to the laptop's data/ dir.
shell = """
cd services/fetcher
FETCHER_DB_PATH="$(pwd)/../../data/fetches.db" uv run uvicorn fetcher.app:app \\
  --workers 1 --port ${port} --env-file ../../.env
"""
help = "Run the fetcher service locally (default port 8000; envs from repo-root .env)"

[tool.poe.tasks.fetcher-dev.args.port]
default = "8765"
help = "Port to bind (8000 is reserved for chroma in docker-compose)"


[tool.poe.tasks.backup]
cmd = "dg launch -m orchestrators.definitions --job backup_readings"
help = "Run readings backup job once from CLI"

## Deploy ##

[tool.poe.tasks.deploy]
cmd = "./scripts/deploy-hcloud.sh ${target}"
help = """
  Run a deploy-hcloud.sh subcommand on Hetzner (default: deploy).
  Forward --branch / --no-build to the deploy subcommand after a -- separator:
    uv run poe deploy -- --branch fix/foo --no-build
"""

[tool.poe.tasks.deploy.args.target]
positional = true
default = "deploy"

## Tunnel ##

[tool.poe.tasks.tunnel]
shell = """
echo "Dagster UI: http://localhost:3030/dags (forwarded to remote :3030, served behind /dags prefix)"
ssh -L 3030:127.0.0.1:3030 -i ${IDENTITY_FILE} ${DEPLOY_TARGET} -N
"""
envfile = ".env.deploy"
help = "SSH tunnel to remote Dagster UI"

## Code QA ##

[tool.poe.tasks.test]
cmd = "pytest -n auto"
help = "Run tests in parallel across CPU cores (pytest-xdist)"

[tool.poe.tasks.check]
sequence = ["fmt", "lint", "test"]
help = "Run all checks: formatting, linting, and tests"

[tool.poe.tasks.fmt]
cmd = "black --check packages/ services/ tests/"
help = "Check code formatting with black (does not modify)"

[tool.poe.tasks.fmt-fix]
cmd = "black packages/ services/ tests/"
help = "Fix code formatting issues automatically with black"

[tool.poe.tasks.lint]
cmd = "ruff check packages/ services/ tests/"
help = "Check code linting with ruff (does not modify)"

[tool.poe.tasks.lint-fix]
cmd = "ruff check --fix packages/ services/ tests/"
help = "Fix code linting issues automatically with ruff"

[tool.poe.tasks.fix]
sequence = ["fmt-fix", "lint-fix"]
help = "Fix all issues: formatting with black and linting with ruff"

[tool.poe.tasks.lock]
sequence = [
    { cmd = "uv lock" },
    { cmd = "uv lock", cwd = "services/fetcher" },
]
help = "Lock workspace + services/fetcher (run after any workspace-member version bump)"

## Workflows ##

[tool.poe.tasks.wiki-ingest]
cmd = "python -m workflows.cli.wiki_ingest"
help = "Run the LangGraph wiki synthesis workflow from the CLI"

[tool.poe.tasks.wiki-lint]
cmd = "python -m workflows.cli.wiki_lint"
help = "Lint wiki pages for structural and quality issues"

[tool.poe.tasks.research]
cmd = "python -m workflows.cli.research"
help = "Run the research agent workflow from the CLI"

## Evals ##

[tool.poe.tasks.retrieval-eval]
cmd = "python -m evals.retrieval.cli"
help = """
  Run the retrieval eval harness — scores a (model, dims, chunker) config on
  Recall@5 / MRR@10 / nDCG@10 against datasets/retrieval_eval.jsonl.
  Pass CLI flags after `--`, e.g.
    uv run poe retrieval-eval -- --raw-store-db /backup/raw_store.db --limit 50
"""

[tool.poe.tasks.wiki-eval]
cmd = "python -m evals.wiki.cli"
help = "Run the wiki-quality eval harness — six quality dimensions across synthesized wiki pages. Not yet implemented; reserved for the layer that evaluates wiki output beyond plain retrieval."

[tool.poe.tasks.generation-eval]
cmd = "python -m evals.generation.cli"
help = "Run the generation-quality eval harness — faithfulness / answer relevance / grounding (Ragas-backed). Not yet implemented; reserved for the layer that evaluates LLM responses against retrieved context."

## Notebooks ##

[tool.poe.tasks.jupyter]
cmd = """
  uv run --extra notebooks jupyter lab packages/evals/notebooks/
    --port 8888
    --IdentityProvider.token "${JUPYTER_SERVER_TOKEN}"
    --no-browser
"""
envfile = ".env"
help = """
  Launch JupyterLab on packages/evals/notebooks/ (the workbench home) with
  the [notebooks] extra installed. Token is a fixed localhost-only dev
  string (no real secret) matching .mcp.json so the jupyter MCP server can
  authenticate. Don't expose 8888 publicly.
"""

[tool.poe.tasks.nb-sync]
cmd = "uv run --extra notebooks jupytext --sync"
help = "Sync .ipynb <-> .py for the given file (pass file path as positional arg)"

[tool.poe.tasks.nb-run]
cmd = "uv run --extra notebooks papermill -k kp-eval --no-progress-bar"
help = "Batch-run a notebook with the kp-eval kernel (input.ipynb output.ipynb [-p key val …])"

## Reset ##

[tool.poe.tasks.reset-wiki]
cmd = "python -m orchestrators.scripts.reset_wiki"
help = "Drop the wiki Postgres schema, data/wiki/ files, and workflow checkpoints"

[tool.poe.tasks.reset-checkpoints]
cmd = "python -m orchestrators.scripts.reset_checkpoints"
help = "Drop the langgraph_checkpoints Postgres schema only"

[tool.poe.tasks.reset-everything]
cmd = "python -m orchestrators.scripts.reset_everything"
help = "Drop all wiki data, raw store, ChromaDB collections, and checkpoints"

[tool.pytest.ini_options]
testpaths = ["tests"]

## Dependency Configurations ##

[tool.black]
line-length = 100
target-version = ["py313"]
# Jupytext py:percent files are notebook source — let jupytext --pipe
# black handle them via `poe nb-sync` instead of double-formatting.
extend-exclude = "packages/evals/notebooks/.*\\.py"

[tool.ruff]
line-length = 100
target-version = "py313"
# Jupytext py:percent files put imports inside cells, not at file top —
# ruff's E402/F401 rules don't apply to notebook source. Lint the .ipynb
# pair separately via `nbqa` if needed.
extend-exclude = ["packages/evals/notebooks/*.py", "packages/evals/notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
